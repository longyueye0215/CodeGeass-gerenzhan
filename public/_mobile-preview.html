<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>移动端预览</title>
    <style>
      html, body { margin: 0; background: #111; display: grid; place-items: center; height: 100%; }
      .wrap { display: flex; gap: 24px; align-items: flex-start; }
      figure { margin: 0; }
      figcaption { color: #888; font: 12px/1.6 monospace; text-align: center; padding-top: 6px; }
      iframe { border: 1px solid #333; border-radius: 18px; background: #000; display: block; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <figure>
        <iframe src="/?mode=mobile" width="390" height="844"></iframe>
        <figcaption>iPhone 12 · 390 × 844</figcaption>
      </figure>
    </div>
  </body>
</html>
